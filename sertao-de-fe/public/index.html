<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js"></script>
<script src="./supabase-config.js"></script>
<script src="./sf-data.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc><template data-dc-template>
<helmet>
<title>Sertão de Fé — O patrimônio das capelas de Triunfo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;background:#FFFFFF;color:#141614;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#E3E7E3;text-decoration:underline;text-underline-offset:3px}a:hover{color:#FFFFFF}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:#141614}
@keyframes sfFade{from{opacity:0}to{opacity:1}}
.sf-show-sm{display:none!important}
.sf-menu{display:none}
/* Tablet com barra lateral: tabelas mais enxutas */
@media (max-width:1240px){
  .sf-row-c{grid-template-columns:64px minmax(0,1fr) 84px 140px 132px!important}
  .sf-row-c>:nth-child(2),.sf-row-c>:nth-child(6){display:none!important}
}
/* Painel sem barra lateral: navegação no topo */
@media (max-width:900px){
  .sf-admin{grid-template-columns:minmax(0,1fr)!important}
  .sf-aside{position:sticky!important;z-index:400;height:auto!important;flex-direction:row!important;flex-wrap:wrap;align-items:center;gap:8px!important;padding:10px 16px!important;border-right:0!important;border-bottom:1px solid #E3E6E2}
  .sf-aside-brand{flex:1;min-width:0;padding:0!important}
  .sf-aside-spacer{display:none!important}
  .sf-aside-site{order:2;padding:8px 12px!important}
  .sf-aside-user{order:3;margin:0!important;padding:0!important;border:0!important}
  .sf-aside-user>span,.sf-aside-user>div{display:none!important}
  .sf-aside-nav{order:4;width:100%;flex-direction:row!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sf-aside-nav::-webkit-scrollbar{display:none}
  .sf-aside-nav>button{flex:none;white-space:nowrap}
  .sf-main{padding:20px 16px 48px!important}
  .sf-tabs{overflow-x:auto;flex-wrap:nowrap!important;scrollbar-width:none}
  .sf-tabs>button{flex:none;white-space:nowrap}
}
/* Celular e tablet em pé */
@media (max-width:860px){
  .sf-hide-sm{display:none!important}
  .sf-show-sm{display:grid!important}
  .sf-header{grid-template-columns:minmax(0,1fr) auto!important;padding:0 16px!important}
  .sf-brand{justify-self:start}
  .sf-brand span{letter-spacing:2.5px!important}
  .sf-menu{display:block;position:absolute;top:100%;left:0;right:0;background:#0F120F;border-bottom:1px solid #1F241F;padding:8px 16px 16px;max-height:calc(100vh - 64px);overflow-y:auto}
  .sf-pad{padding-left:16px!important;padding-right:16px!important}
  .sf-pad-y{padding-top:64px!important;padding-bottom:64px!important}
  .sf-left{text-align:left!important;max-width:none!important}
  .sf-hero{height:auto!important;max-height:none!important;min-height:calc(100vh - 64px);min-height:calc(100svh - 64px)}
  .sf-hero-in{height:auto!important;min-height:calc(100vh - 64px);min-height:calc(100svh - 64px);gap:32px;padding-top:40px!important;padding-bottom:32px!important}
  .sf-mapa{grid-template-columns:minmax(0,1fr)!important;height:auto!important;min-height:0!important}
  .sf-mapa-map{order:1;height:62vh;height:62svh;min-height:340px}
  .sf-mapa-list{order:2;border-right:0!important;border-top:1px solid #232823}
  input,select,textarea{font-size:16px!important}
}
/* Celular */
@media (max-width:760px){
  .sf-head-c{display:none!important}
  .sf-row-c{grid-template-columns:64px minmax(0,1fr)!important;grid-template-areas:"img name" "img zone" "status status" "act act";gap:6px 12px!important;padding:14px 16px!important}
  .sf-row-c>:nth-child(1){grid-area:img}
  .sf-row-c>:nth-child(3){grid-area:name}
  .sf-row-c>:nth-child(4){grid-area:zone;font-size:13px}
  .sf-row-c>:nth-child(5){grid-area:status;margin-top:6px}
  .sf-row-c>:nth-child(7){grid-area:act;justify-content:stretch!important;margin-top:4px}
  .sf-row-g{grid-template-columns:44px minmax(0,1fr)!important;grid-template-areas:"av name" "av info" "status status" "act act";gap:6px 12px!important;padding:14px 16px!important}
  .sf-row-g>:nth-child(1){grid-area:av}
  .sf-row-g>:nth-child(2){grid-area:name}
  .sf-row-g>:nth-child(3){grid-area:info}
  .sf-row-g>:nth-child(4){grid-area:status;margin-top:6px}
  .sf-row-g>:nth-child(5){grid-area:act;justify-content:stretch!important;margin-top:4px}
  .sf-row-c>:nth-child(7) button:first-child,.sf-row-g>:nth-child(5) button:first-child{flex:1}
  .sf-row-m{grid-template-columns:72px minmax(0,1fr)!important}
  .sf-row-m>:nth-child(1){width:72px!important;height:54px!important}
  .sf-row-m>:nth-child(3){grid-column:1/-1}
  .sf-amap{height:300px!important}
  .sf-lb-stage{position:relative;padding:0!important}
  .sf-lb-img{max-width:100%!important}
  .sf-lb-nav{position:absolute;top:50%;margin-top:-22px;width:44px!important;height:44px!important;background:rgba(15,18,15,.6)!important;z-index:1}
  .sf-lb-prev{left:8px}
  .sf-lb-next{right:8px}
}
/* Toque: alvos confortáveis */
@media (pointer:coarse){
  button,select{min-height:40px}
  .sf-icon-btn{width:44px!important;height:44px!important}
  .sf-move{width:44px!important}
  .sf-links a{display:inline-block;padding:10px 4px}
  .leaflet-touch .leaflet-bar a{width:40px;height:40px;line-height:40px}
  footer a,footer button{display:inline-block;padding:10px 4px}
}
@media (max-height:500px) and (max-width:900px){.sf-aside{position:static!important}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>

<sc-if value="{{ notice }}" hint-placeholder-val="{{ false }}">
  <div role="alert" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100000;width:min(560px,calc(100% - 32px));display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-radius:10px;background:#FFF;color:#7A2E12;border:1px solid #B4633E;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;line-height:1.5">
    <span>{{ notice }}</span>
    <button type="button" onClick="{{ closeNotice }}" aria-label="Fechar aviso" style="border:0;background:none;color:#7A2E12;font-size:18px;line-height:1;cursor:pointer">×</button>
  </div>
</sc-if>

<sc-if value="{{ confirmOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ confirmNo }}" style="position:fixed;inset:0;background:rgba(20,22,20,.45);z-index:99000"></div>
  <div role="alertdialog" aria-modal="true" aria-label="{{ confirmTitle }}" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99001;width:min(440px,calc(100% - 32px));background:#FFF;color:#141614;border-radius:14px;padding:24px;box-shadow:0 16px 48px rgba(0,0,0,.3)">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">{{ confirmTitle }}</div>
    <p style="font-size:14px;line-height:1.55;color:#5B625D;margin:0 0 20px">{{ confirmText }}</p>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button type="button" onClick="{{ confirmNo }}" style="padding:10px 18px;border-radius:999px;border:1px solid #E3E6E2;background:#FFF;color:#141614;font-weight:700;font-size:14px;cursor:pointer">Cancelar</button>
      <button type="button" onClick="{{ confirmYes }}" style="padding:10px 18px;border-radius:999px;border:0;background:#A33B20;color:#FFF;font-weight:700;font-size:14px;cursor:pointer">Excluir</button>
    </div>
  </div>
</sc-if>

<sc-if value="{{ isPublic }}" hint-placeholder-val="{{ true }}">
<div style="zoom: {{ zoom }}; filter: {{ filter }}; min-height:100vh;background:#0F120F;color:#FFF">

  <header style="position:sticky;top:0;z-index:500;background:rgba(15,18,15,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #1F241F">
    <div class="sf-header" style="max-width:1320px;margin:0 auto;padding:0 28px;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px">
      <nav class="sf-hide-sm" style="display:flex;gap:2px;flex-wrap:wrap">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="3">
          <button onClick="{{ n.onClick }}" style="background:none;border:0;padding:8px 12px;font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit;color: {{ n.color }};box-shadow:inset 0 -1px 0 {{ n.line }}">{{ n.label }}</button>
        </sc-for>
      </nav>
      <button class="sf-brand" onClick="{{ goHome }}" style="display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:#FFF;font-family:inherit">
        <svg width="11" height="15" viewBox="0 0 18 24" fill="none" stroke="#FFF" stroke-width="2"><path d="M9 1v22M2 7h14"></path></svg>
        <span style="font-size:15px;font-weight:700;letter-spacing:4px;white-space:nowrap">SERTÃO DE FÉ</span>
      </button>
      <div class="sf-hide-sm" style="display:flex;gap:8px;align-items:center;justify-content:flex-end">
        <button onClick="{{ toggleBig }}" title="Aumentar fonte" style="width:36px;height:36px;border-radius:999px;border:1px solid #2A2F2A;background: {{ bigBg }};cursor:pointer;font-weight:700;font-size:12px;color:#FFF;font-family:inherit">A+</button>
        <button onClick="{{ toggleContrast }}" title="Alto contraste" style="width:36px;height:36px;border-radius:999px;border:1px solid #2A2F2A;background: {{ conBg }};cursor:pointer;display:grid;place-items:center"><svg width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#FFF" stroke-width="1.4"></circle><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="#FFF"></path></svg></button>
        <button onClick="{{ goSearch }}" title="Buscar" style="width:36px;height:36px;border-radius:999px;border:1px solid #2A2F2A;background:transparent;cursor:pointer;display:grid;place-items:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#FFF" stroke-width="1.5"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg></button>
        <button onClick="{{ goAdmin }}" style="height:36px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,0.7);background:transparent;color:#FFF;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">Área da equipe</button>
      </div>
      <button class="sf-show-sm" onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuExpanded }}" style="width:44px;height:44px;border-radius:999px;border:1px solid #2A2F2A;background:transparent;cursor:pointer;place-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{ menuIcon }}"></path></svg>
      </button>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div class="sf-menu">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="3"><button onClick="{{ n.onClick }}" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #1F241F;padding:14px 4px;color:#FFF;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">{{ n.label }}</button></sc-for>
        <button onClick="{{ goSearch }}" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #1F241F;padding:14px 4px;color:#FFF;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">Buscar capela</button>
        <button onClick="{{ toggleBig }}" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #1F241F;padding:14px 4px;color:#FFF;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">{{ bigLabel }}</button>
        <button onClick="{{ toggleContrast }}" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #1F241F;padding:14px 4px;color:#FFF;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">{{ contrastLabel }}</button>
        <button onClick="{{ goAdmin }}" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #1F241F;padding:14px 4px;color:#FFF;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">Área da equipe</button>
      </div>
    </sc-if>
  </header>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <section class="sf-hero" data-screen-label="Início — Abertura" style="position:relative;height:calc(100vh - 64px);min-height:600px;max-height:940px;overflow:hidden;background:#0F120F;color:#FFF">
      <x-import component-from-global-scope="HeroAbertura" from="./abertura.jsx" on-end="{{ onIntroEnd }}" play-key="{{ introKey }}" skip="{{ introSkip }}" hint-size="100%,100%" style="position:absolute;inset:0"></x-import>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,18,15,0.72) 0%,rgba(15,18,15,0.25) 38%,rgba(15,18,15,0.35) 62%,rgba(15,18,15,0.92) 100%);pointer-events:none"></div>
      <div class="sf-pad sf-hero-in" style="position:relative;height:100%;max-width:1320px;margin:0 auto;padding:56px 28px 48px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:28px;flex-wrap:wrap">
          <div>
            <h1 style="font-size:clamp(60px,10vw,148px);font-weight:600;line-height:1.08;letter-spacing:-2px;text-transform:uppercase;margin:0">
              <span style="display:block;color:#A3AAA4">Sertão</span>
              <span style="display:block;color:#FFF">de Fé</span>
            </h1>
            <p style="font-size:15px;line-height:1.6;margin:36px 0 0;max-width:300px;color:#E3E7E3">O patrimônio das capelas de Triunfo, no sertão de Pernambuco.</p>
          </div>
          <p class="sf-left" style="font-size:14px;line-height:1.65;color:#E3E7E3;max-width:280px;text-align:right;margin:8px 0 0;font-style:italic">“Onde a seca molha a alma e a fé faz florescer esperança”</p>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button onClick="{{ goCapelas }}" style="display:flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;border:1px solid rgba(255,255,255,0.8);background:rgba(15,18,15,0.35);color:#FFF;font-weight:500;font-size:14px;cursor:pointer;font-family:inherit;backdrop-filter:blur(6px)">Explorar as capelas <span>→</span></button>
            <button onClick="{{ goMapa }}" style="display:flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;border:1px solid rgba(255,255,255,0.35);background:rgba(15,18,15,0.35);color:#FFF;font-weight:500;font-size:14px;cursor:pointer;font-family:inherit;backdrop-filter:blur(6px)">Ver no mapa <span>→</span></button>
          </div>
          <button onClick="{{ scrollDown }}" style="display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid #FFF;padding:6px 0 8px;color:#FFF;font-size:13px;cursor:pointer;font-family:inherit;min-width:160px;justify-content:space-between">Começar <span>↓</span></button>
        </div>
      </div>
    </section>

    <section ref="{{ afterHeroRef }}" data-screen-label="Início — Destaques" style="position:relative;background:#0F120F;color:#FFF;overflow:hidden">
      <div style="position:absolute;left:-14px;bottom:40px;font-size:clamp(110px,15vw,220px);font-weight:800;letter-spacing:8px;color:#191D19;line-height:1;pointer-events:none;white-space:nowrap">CAPELAS</div>
      <div class="sf-pad sf-pad-y" style="position:relative;max-width:1320px;margin:0 auto;padding:104px 28px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px;align-items:start">
          <div style="display:flex;flex-direction:column;gap:22px;max-width:480px">
            <div style="display:flex;align-items:center;gap:10px"><span style="width:40px;height:1px;background:#9AA39C"></span><span style="font-size:12px;color:#B8C0B9;white-space:nowrap">Capelas em destaque · {{ fe.pos }}</span></div>
            <h2 style="font-size:clamp(28px,3vw,40px);font-weight:500;line-height:1.12;letter-spacing:-0.3px;text-transform:uppercase;margin:0;text-wrap:pretty">{{ fe.name }}</h2>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#B8C0B9">
              <span style="white-space:nowrap">Nº {{ fe.numStr }}</span><span>·</span>
              <span style="display:flex;align-items:center;gap:6px;white-space:nowrap"><span style="width:7px;height:7px;border-radius:50%;background: {{ fe.pinColor }}"></span>Zona {{ fe.zoneLabel }}</span><span>·</span>
              <span>{{ fe.padroeiro }}</span>
            </div>
            <p style="font-size:14.5px;line-height:1.75;color:#B8C0B9;margin:0;text-wrap:pretty">{{ fe.excerpt }}</p>
            <div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #262B26">
              <sc-for list="{{ fe.facts }}" as="f" hint-placeholder-count="4">
                <div style="padding:13px 0;border-bottom:1px solid #262B26">
                  <div style="font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8E968F;margin-bottom:4px">{{ f.k }}</div>
                  <div style="font-size:14px;font-weight:500">{{ f.v }}</div>
                </div>
              </sc-for>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
              <button onClick="{{ fe.open }}" style="display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,0.8);background:none;color:#FFF;font-weight:500;font-size:14px;cursor:pointer;font-family:inherit">Ver ficha completa <span>→</span></button>
              <button onClick="{{ featPrev }}" aria-label="Capela anterior" style="width:44px;height:44px;border-radius:999px;border:1px solid #2F352F;background:none;cursor:pointer;display:grid;place-items:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#FFF" stroke-width="1.5"><path d="M10 3L5 8l5 5"></path></svg></button>
              <button onClick="{{ featNext }}" aria-label="Próxima capela" style="width:44px;height:44px;border-radius:999px;border:1px solid #2F352F;background:none;cursor:pointer;display:grid;place-items:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#FFF" stroke-width="1.5"><path d="M6 3l5 5-5 5"></path></svg></button>
            </div>
          </div>
          <div>
            <div style="position:relative;aspect-ratio:4/3;background:#1B1F1B;overflow:hidden">
              <img src="{{ fe.src }}" alt="{{ fe.alt }}" onClick="{{ fe.expand }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in">
              <button onClick="{{ fe.photoPrev }}" aria-label="Foto anterior" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;border:0;background:rgba(15,18,15,0.55);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#FFF" stroke-width="1.6"><path d="M10 3L5 8l5 5"></path></svg></button>
              <button onClick="{{ fe.photoNext }}" aria-label="Próxima foto" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;border:0;background:rgba(15,18,15,0.55);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#FFF" stroke-width="1.6"><path d="M6 3l5 5-5 5"></path></svg></button>
              <button onClick="{{ fe.expand }}" aria-label="Ampliar fotos" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,0.82);cursor:pointer;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 12 12" fill="none" stroke="#141614" stroke-width="1.4"><path d="M1 4V1h3M8 1h3v3M11 8v3H8M4 11H1V8"></path></svg></button>
              <div style="position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:6px">
                <sc-for list="{{ fe.dots }}" as="d" hint-placeholder-count="4"><span style="width: {{ d.w }};height:3px;border-radius:2px;background:#FFF;opacity: {{ d.op }};transition:all .3s"></span></sc-for>
              </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding:3px">
              <sc-for list="{{ featThumbs }}" as="t" hint-placeholder-count="8">
                <button onClick="{{ t.onClick }}" title="{{ t.name }}" style="flex:0 0 84px;height:60px;padding:0;border:0;background:none;cursor:pointer;opacity: {{ t.op }};transition:opacity .25s">
                  <img src="{{ t.cover }}" alt="" style="width:84px;height:60px;object-fit:cover;display:block;outline:1px solid {{ t.ring }};outline-offset:2px">
                </button>
              </sc-for>
            </div>
          </div>
        </div>

  }
  componentWillUnmount() {

  }
  componentDidUpdate() { this.syncMaps(); }

  readHash() {
    const h = location.hash.replace(/^#\/?/, '');
    const [a, b] = h.split('/');
    if (a === 'capelas' && b) { const c = this.state.chapels.find(x => x.slug === b); this.setState({ view: 'capelas', drawerId: c ? c.id : null, slide: 0 }); return; }
    if (['capelas', 'mapa', 'admin'].includes(a)) this.setState({ view: a, drawerId: null, lb: null });
    else if (a === '' || a === 'inicio') this.setState({ view: 'home', drawerId: null, lb: null });
  }
  go(view) {
    this.setState({ view, drawerId: null, lb: null, menuOpen: false });
    history.replaceState(null, '', view === 'home' ? '#/' : '#/' + view);
    window.scrollTo(0, 0);
  }

  // ---------- data ----------
  pub() { return this.state.chapels.filter(c => c.status === 'Publicado' && !c.removed_at); }
  pubGuardians() { const ids = this.pub().map(c => c.id); return this.state.guardians.filter(g => g.status === 'Publicado' && !g.removed_at && (g.capela_id == null || ids.includes(g.capela_id))); }
  photos(c) { const f = c.media.filter(m => m.type === 'foto'); return [...f.filter(m => m.cover), ...f.filter(m => !m.cover)]; }
  cover(c) { const p = this.photos(c); return p.length ? p[0].url : img(12); }
  card(c) {
    const z = ZONES[c.zona], ph = this.photos(c);
    return {
      ...c, numStr: pad2(c.num), zoneLabel: z.label, zoneColor: z.color, zoneBg: z.bg, cover: this.cover(c),
      alt: ph[0] ? ph[0].alt : c.name, photoCount: ph.length,
      hasVideo: c.media.some(m => m.type === 'video'), hasAudio: c.media.some(m => m.type === 'audio') || this.pubGuardians().some(g => g.capela_id === c.id && g.audio_url),
      open: () => this.openFicha(c.id), lightbox: () => this.openLb(c.id, 0)

  }
  updChapel(id, fn, cb) { this.setState(s => ({ chapels: s.chapels.map(c => c.id === id ? fn(c) : c), saved: false }), cb); }
  addLog(what, cid) {
    const who = this.state.member || 'Ana';
    this.setState(s => ({ log: [{ who, what, t: Date.now(), cid }, ...s.log].slice(0, 30) }));
    if (DB.configured) DB.addLog(who, what, cid).catch(e => console.error(e));
  }

  // ---------- supabase ----------
  fail(prefix, e) { console.error(e); this.setState({ notice: prefix + ': ' + e.message }); }
  async bootstrap() {
    try {
      const member = await DB.currentMember();
      if (member) this.setState({ authed: true, member: member.nome });
      await this.loadData(!!member);
    } catch (e) {
      this.fail('Não foi possível carregar as capelas', e);
    } finally {
      this.setState({ authChecking: false });
    }
  }
  async loadData(isMember) {
    const [chapels, guardians, log] = await Promise.all([DB.loadChapels(), DB.loadGuardians(), isMember ? DB.loadLog() : []]);
    this.setState({ chapels, guardians, log }, () => this.readHash());
  }
  async signIn() {
    if (this.state.loginBusy) return;
    this.setState({ loginBusy: true, loginError: '' });
    try {
      const member = await DB.signIn(this.state.loginEmail ?? '', this.state.loginPass ?? '');
      this.setState({ authed: true, member: member.nome, aView: 'painel', loginPass: '' });
      await this.loadData(true).catch(e => this.fail('Não foi possível carregar as capelas', e));
    } catch (e) {
      this.setState({ loginError: e.message });
    } finally {
      this.setState({ loginBusy: false });
    }
  }
  async signOut() {
    try {
      await DB.signOut();
      this.setState({ authed: false, member: null, editId: null, gEditId: null, aView: 'painel', loginPass: '', log: [] });
      await this.loadData(false);
    } catch (e) {
      this.fail('Não foi possível sair', e);
    }
  }
  // Fila: cada salvamento lê o estado mais recente e não concorre com o anterior.
  enqueueSave(listKey, id, save, nameOf) {
    if (!DB.configured) { this.setState({ saved: true }); return Promise.resolve(true); }
    this.setState(s => ({ saving: (s.saving || 0) + 1 }));
    this.saveQueue = (this.saveQueue || Promise.resolve()).then(async () => {
      const find = () => this.state[listKey].find(x => x.id === id), c = find();
      try {
        await save(c);
        const unchanged = find() === c, updated_at = new Date().toISOString();
        this.setState(s => ({ [listKey]: s[listKey].map(x => x.id === id ? { ...x, updated_at } : x), saved: unchanged || s.saved }));
        return true;
      } catch (e) {
        this.fail('Não foi possível salvar ' + nameOf(c), e);
        return false;
      } finally {
        this.setState(s => ({ saving: s.saving - 1 }));
      }
    });
    return this.saveQueue;
  }
  persist(id) { return this.enqueueSave('chapels', id, c => DB.saveChapel(c), c => c.name); }
  persistGuardian(id) { return this.enqueueSave('guardians', id, g => DB.saveGuardian(g), g => g.nome); }
  updGuardian(id, fn, cb) { this.setState(s => ({ guardians: s.guardians.map(g => g.id === id ? fn(g) : g), saved: false }), cb); }
  updGuardianAndPersist(id, fn, what) {
    this.updGuardian(id, fn, async () => { if (await this.persistGuardian(id)) { const g = this.state.guardians.find(x => x.id === id); this.addLog(what(g), g.capela_id); } });
  }
  askDelete(title, text, action) { this.setState({ confirm: { title, text, action } }); }
  deleteChapel(c) {
    this.askDelete('Excluir ' + c.name + '?', 'A capela sai do site e vai para a lixeira, junto com as mídias dela. Você pode restaurá-la pelo filtro Lixeira.', () => {
      this.updAndPersist(c.id, x => ({ ...x, removed_at: new Date().toISOString() }), 'moveu ' + c.name + ' para a lixeira');
      if (this.state.editId === c.id) this.setState({ editId: null, aView: 'capelas' });
    });
  }
  restoreChapel(c) { this.updAndPersist(c.id, x => ({ ...x, removed_at: null }), 'restaurou ' + c.name); }
  deleteGuardian(g) {
    this.askDelete('Excluir ' + g.nome + '?', 'O guardião e o depoimento saem do site e vão para a lixeira. Você pode restaurá-los pelo filtro Lixeira.', () => {
      this.updGuardianAndPersist(g.id, x => ({ ...x, removed_at: new Date().toISOString() }), x => 'moveu ' + x.nome + ' para a lixeira');
      if (this.state.gEditId === g.id) this.setState({ gEditId: null, aView: 'guardioes' });
    });
  }
  async createGuardian(capelaId) {
    const fields = { nome: 'Novo guardião', capela_id: capelaId ?? null, status: 'Rascunho' };
    try {
      const g = DB.configured ? await DB.createGuardian(fields) : { ...fields, id: uid(), papel: '', foto_url: null, foto_path: null, citacao: '', transcricao: '', audio_url: null, audio_path: null, autorizacao: false, destaque: false, removed_at: null };
      this.setState(s => ({ guardians: [...s.guardians, g], gEditId: g.id, aView: 'guardiao', guardFilter: 'Todas', saved: false }));
      this.addLog('criou um rascunho de guardião', g.capela_id);
    } catch (e) {
      this.fail('Não foi possível criar o guardião', e);
    }
  }
  // kind: 'foto' ou 'audio'; as colunas são <kind>_url e <kind>_path.
  async uploadGuardianFile(g, kind, file) {
    if (!file) return;
    this.setState({ uploading: true });
    try {
      const up = DB.configured ? await DB.uploadFile('guardioes/' + g.id, file) : { url: URL.createObjectURL(file), storage_path: null };
      this.updGuardianAndPersist(g.id, x => ({ ...x, [kind + '_url']: up.url, [kind + '_path']: up.storage_path }), x => 'enviou ' + (kind === 'foto' ? 'a foto' : 'o áudio') + ' de ' + x.nome);
    } catch (e) {
      this.fail('Não foi possível enviar ' + file.name, e);
    } finally {
      this.setState({ uploading: false });
    }
  }
  filterChips(cur, items, set) {
    const counts = [['Todas', items.filter(x => !x.removed_at).length], ...STATUSES.map(st => [st, items.filter(x => !x.removed_at && x.status === st).length]), [TRASH_FILTER, items.filter(x => x.removed_at).length]];
    return counts.map(([k, n]) => { const on = cur === k; return { label: k + ' · ' + n, onClick: () => set(k), bg: on ? '#141614' : '#FFF', color: on ? '#FFF' : '#141614', border: on ? '#141614' : '#E3E6E2' }; });
  }
  matchesFilter(x, f) { return f === TRASH_FILTER ? !!x.removed_at : !x.removed_at && (f === 'Todas' || x.status === f); }

  updAndPersist(id, fn, what) {
    this.updChapel(id, fn, async () => { if (await this.persist(id)) this.addLog(what, id); });
  }
  async createChapel() {
    const num = Math.max(0, ...this.state.chapels.map(c => c.num)) + 1;
    try {
      const c = await DB.createChapel({ num, slug: 'nova-capela-' + Date.now().toString(36), name: 'Nova capela', zona: 'rural', conservacao: 'Bom', lat: CENTER[0], lng: CENTER[1] });
      this.setState(s => ({ chapels: [...s.chapels, c], editId: c.id, aView: 'editor', aTab: 'dados', saved: false }));
      this.addLog('criou um rascunho de capela', c.id);
    } catch (e) {
      this.fail('Não foi possível criar a capela', e);
    }
  }
  async uploadFiles(files) {
    const id = this.state.editId, list = [...files], arr = [];
    if (!list.length) return;
    this.setState({ uploading: true });
    for (const f of list) {
      try {
        arr.push({ id: uid(), type: fileType(f), ...await DB.uploadFile('capelas/' + id, f), caption: f.name.replace(/\.[^.]+$/, ''), alt: '', credit: '', cover: false });
      } catch (e) {
        this.fail('Não foi possível enviar ' + f.name, e);
      }
    }
    this.setState({ uploading: false });
    if (arr.length) this.updAndPersist(id, c => ({ ...c, media: [...c.media, ...arr] }), 'enviou ' + arr.length + ' arquivo(s) para ' + this.state.chapels.find(c => c.id === id).name);
  }

  openFicha(id) {
    const c = this.state.chapels.find(x => x.id === id);
    this.setState({ drawerId: id, slide: 0, transOpen: null, shared: false });
    if (c) history.replaceState(null, '', '#/capelas/' + c.slug);
    if (this.maps.full && c) this.focusPin(c, false);
  }
  closeDrawer() {
    this.setState({ drawerId: null });
    const v = this.state.view; history.replaceState(null, '', v === 'home' ? '#/' : '#/' + v);
  }
  openLb(id, i) { this.setState({ lb: { id, i } }); }
  lbStep(d) { this.setState(s => { const c = s.chapels.find(x => x.id === s.lb.id); const n = this.photos(c).length; return { lb: { ...s.lb, i: (s.lb.i + d + n) % n } }; }); }

  // ---------- maps ----------
  ensureL(cb, n = 0) { if (window.L) cb(window.L); else if (n < 100) setTimeout(() => this.ensureL(cb, n + 1), 100); }
  bindMap(key, el, opts) {
    const cur = this.maps[key];
    if (!el) { if (cur) { cur.map.remove(); delete this.maps[key]; } return; }
    if (cur && cur.el === el) return;
    if (cur) { cur.map.remove(); delete this.maps[key]; }
    this.ensureL(L => {
      if (!el.isConnected || this.maps[key]) return;
      const map = L.map(el, { zoomControl: false, scrollWheelZoom: !!opts.wheel, attributionControl: true }).setView(opts.center || CENTER, opts.zoom || 11);
      if (opts.relief) {
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles © Esri' }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, opacity: 0.35 }).addTo(map);
        map.getPane('tilePane').style.filter = 'sepia(0.32) saturate(0.85) brightness(1.04) contrast(0.96)';
      } else {
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles © Esri' }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
      }
      map.setMaxZoom(16);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      const m = { el, map, layer: L.layerGroup().addTo(map), sig: '', markers: {} };
      this.maps[key] = m;
      if (opts.onClick) map.on('click', opts.onClick);
      setTimeout(() => { if (this.maps[key] !== m) return; map.invalidateSize(); this.syncMaps(); }, 120);
    });
  }
  refHome = el => this.bindMap('home', el, { zoom: 11, relief: true });
  refFull = el => this.bindMap('full', el, { zoom: 11, wheel: true, relief: true });
  refMini = el => this.bindMap('mini', el, { zoom: 14, relief: true });
  refAdmin = el => this.bindMap('admin', el, { zoom: 14, wheel: true, onClick: e => this.setLatLng(e.latlng.lat, e.latlng.lng) });

  pinHtml(c, active) {
    const z = ZONES[c.zona], s = active ? 36 : 28;
    return '<div style="width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:' + z.color + ';color:#fff;font:700 ' + (active ? 13 : 12) + 'px Mulish,sans-serif;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(43,38,32,.3);transition:all .2s">' + c.num + '</div>';
  }
  tipHtml(c) {
    const z = ZONES[c.zona];
    return '<div style="display:flex;gap:10px;align-items:center;font-family:Mulish,sans-serif;min-width:220px"><img src="' + this.cover(c) + '" style="width:64px;height:48px;object-fit:cover;border-radius:6px"><div><div style="font-weight:700;font-size:13px;color:#2B2620;line-height:1.25;white-space:normal;max-width:170px">' + c.name + '</div><div style="font-size:12px;color:#6E655A">' + c.padroeiro + '</div><div style="font-size:11px;font-weight:700;color:' + z.color + ';text-transform:uppercase;letter-spacing:1px;margin-top:2px">' + z.label + '</div></div></div>';
  }
  setPins(key, list, active, opts = {}) {
    const m = this.maps[key]; if (!m || !window.L) return;
    const L = window.L;
    const sig = list.map(c => c.id + ':' + c.lat + ',' + c.lng + c.zona + c.media.length).join('|') + '#' + active + '#' + (opts.fit || '');
    if (m.sig === sig) return;
    const firstFit = m.sig.split('#')[2] !== (opts.fit || '') || !m.sig;
    m.sig = sig; m.layer.clearLayers(); m.markers = {};
    list.forEach(c => {
      const a = c.id === active;
      const mk = L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: this.pinHtml(c, a), iconSize: [a ? 36 : 28, a ? 36 : 28], iconAnchor: [a ? 18 : 14, a ? 18 : 14] }), draggable: !!opts.drag, zIndexOffset: a ? 1000 : 0 });
      if (!opts.noTip) mk.bindTooltip(this.tipHtml(c), { direction: 'top', offset: [0, -14], opacity: 1 });
      if (opts.click) mk.on('click', () => opts.click(c));
      if (opts.drag) mk.on('dragend', e => { const p = e.target.getLatLng(); this.setLatLng(p.lat, p.lng); });
      mk.addTo(m.layer); m.markers[c.id] = mk;
    });
    if (opts.zones) Object.keys(ZONES).forEach(z => {
      const pts = list.filter(c => c.zona === z); if (!pts.length) return;
      const la = pts.reduce((a, c) => a + c.lat, 0) / pts.length, ln = pts.reduce((a, c) => a + c.lng, 0) / pts.length;
      const rad = Math.max(1400, ...pts.map(c => m.map.distance([la, ln], [c.lat, c.lng]))) + 1300;
      L.circle([la, ln], { radius: rad, color: ZONES[z].color, weight: 1.5, dashArray: '4 6', fillColor: ZONES[z].color, fillOpacity: 0.09, interactive: false }).addTo(m.layer);
    });
    if (opts.region && active) { const c = list.find(x => x.id === active); if (c) L.circle([c.lat, c.lng], { radius: 900, color: ZONES[c.zona].color, weight: 1, fillOpacity: 0.08 }).addTo(m.layer); }
    if (opts.fit && firstFit && list.length > 1) m.map.fitBounds(L.latLngBounds(list.map(c => [c.lat, c.lng])), { paddingTopLeft: [40, 80], paddingBottomRight: [40, 40], maxZoom: 13 });
    if (opts.center) m.map.setView(opts.center, m.map.getZoom());
  }
  syncMaps() {
    const s = this.state, pub = this.pub(), f = z => z === 'todas' ? pub : pub.filter(c => c.zona === z);
    this.setPins('home', f(s.homeZone), null, { click: c => this.openFicha(c.id), fit: s.homeZone, zones: true });
    this.setPins('full', f(s.mapZone), s.drawerId || s.hoverId, { click: c => this.openFicha(c.id), fit: s.mapZone, region: true, zones: true });
    const d = s.chapels.find(c => c.id === s.drawerId);
    if (d) this.setPins('mini', [d], d.id, { noTip: true, center: [d.lat, d.lng] });
    const e = s.chapels.find(c => c.id === s.editId);
    if (e) this.setPins('admin', [e], e.id, { noTip: true, drag: true, center: [e.lat, e.lng] });
  }
  focusPin(c, tip) {
    const m = this.maps.full; if (!m) return;
    m.map.flyTo([c.lat, c.lng], 14, { duration: 0.8 });
    if (tip) setTimeout(() => { const mk = this.maps.full && this.maps.full.markers[c.id]; if (mk) mk.openTooltip(); }, 850);
  }
  setLatLng(lat, lng) { const id = this.state.editId; this.updChapel(id, c => ({ ...c, lat: +(+lat).toFixed(5), lng: +(+lng).toFixed(5) })); }

  // ---------- media upload ----------
  addFiles(files) {
    if (DB.configured) return this.uploadFiles(files);
    const id = this.state.editId, arr = [...files].map(f => ({
      id: uid(), type: fileType(f),
      url: URL.createObjectURL(f), caption: f.name.replace(/\.[^.]+$/, ''), alt: '', credit: '', cover: false
    }));
    if (!arr.length) return;
    this.updChapel(id, c => ({ ...c, media: [...c.media, ...arr] }));
    this.addLog('enviou ' + arr.length + ' arquivo(s) para ' + this.state.chapels.find(c => c.id === id).name, id);
  }
  updMedia(mid, patch) { this.updChapel(this.state.editId, c => ({ ...c, media: c.media.map(m => m.id === mid ? { ...m, ...patch } : m) })); }
  moveMedia(mid, d) {
    this.updChapel(this.state.editId, c => { const a = [...c.media], i = a.findIndex(m => m.id === mid), j = i + d; if (j < 0 || j >= a.length) return c; [a[i], a[j]] = [a[j], a[i]]; return { ...c, media: a }; });
  }

  chips(cur, set, withAll = true) {
    const opts = [['todas', 'Todas', '#141614'], ['urbana', 'Urbana', ZONES.urbana.color], ['rural', 'Rural', ZONES.rural.color], ['distrital', 'Distrital', ZONES.distrital.color]];
    return opts.map(([k, l, col]) => { const on = cur === k; const pin = k === 'todas' ? '#C9A45C' : ZONES[k].pin; return { label: l, onClick: () => set(k), bg: on ? '#FFF' : 'transparent', color: on ? '#141614' : '#FFF', border: on ? '#FFF' : '#2F352F', dot: on && k === 'todas' ? '#141614' : pin }; });
  }

  renderVals() {
    const s = this.state, pub = this.pub(), pubG = this.pubGuardians(), isAdmin = s.view === 'admin';
    const live = s.chapels.filter(c => !c.removed_at), liveG = s.guardians.filter(g => !g.removed_at);
    const chapelById = id => s.chapels.find(c => c.id === id);
    const guardianNames = c => pubG.filter(g => g.capela_id === c.id).map(g => g.nome).join(', ') || '—';
    const navDefs = [['Início', 'home'], ['Capelas', 'capelas'], ['Mapa', 'mapa']];
    const navItems = navDefs.map(([l, v]) => ({ label: l, onClick: () => v && this.go(v), color: s.view === v ? '#FFFFFF' : '#9AA39C', line: s.view === v ? '#FFFFFF' : 'transparent' }));
    const heroImgs = [12, 3, 0, 10, 18];
    const heroSlides = heroImgs.map((n, i) => ({ src: img(n), alt: 'Fachada de capela em Triunfo', op: i === s.hero ? 1 : 0, scale: i === s.hero ? 1.06 : 1, dotW: i === s.hero ? '28px' : '10px', dotOp: i === s.hero ? 1 : 0.55 }));
    const featured = pub.filter(c => c.destaque).map(c => this.card(c));
    const fN = featured.length || 1, fI = (s.featIdx || 0) % fN, fc = featured[fI] || this.card(pub[0] || BLANK_CHAPEL);
    const fPh = this.photos(fc), fPn = fPh.length || 1, fP = (s.featPhoto || 0) % fPn;
    const fe = {
      ...fc, pos: pad2(fI + 1) + ' / ' + pad2(featured.length),
      src: (fPh[fP] || {}).url, alt: (fPh[fP] || {}).alt, counter: (fP + 1) + '/' + fPh.length,
      dots: fPh.map((_, i) => ({ w: i === fP ? '22px' : '8px', op: i === fP ? 1 : 0.6 })),
      photoPrev: e => { e.stopPropagation(); this.setState({ featPhoto: (fP - 1 + fPn) % fPn }); },
      photoNext: e => { e.stopPropagation(); this.setState({ featPhoto: (fP + 1) % fPn }); },
      expand: () => this.openLb(fc.id, fP),
      facts: [['Festa', fc.festa], ['Fundação', 'c. ' + fc.ano], ['Estilo', fc.estilo], ['Guardião(ã)', guardianNames(fc)]].map(([k, v]) => ({ k, v })),

      vals.eMedia = ec.media.map(m => ({
        ...m, isFoto: m.type === 'foto', notFoto: m.type !== 'foto', typeLabel: m.type === 'video' ? (m.embed ? 'VÍDEO · LINK' : 'VÍDEO') : 'ÁUDIO',
        altBorder: m.alt.trim() ? '#E3E6E2' : '#B4633E', canCover: m.type === 'foto' && !m.cover,
        onCaption: e => this.updMedia(m.id, { caption: e.target.value }), onAlt: e => this.updMedia(m.id, { alt: e.target.value }), onCredit: e => this.updMedia(m.id, { credit: e.target.value }),
        up: () => this.moveMedia(m.id, -1), down: () => this.moveMedia(m.id, 1),
        setCover: () => this.updChapel(ec.id, c => ({ ...c, media: c.media.map(x => ({ ...x, cover: x.id === m.id })) })),
        remove: () => this.updAndPersist(ec.id, c => ({ ...c, media: c.media.filter(x => x.id !== m.id) }), 'moveu um arquivo para a lixeira')
      }));
      const nVozes = liveG.filter(g => g.capela_id === ec.id).length;
      vals.eVozesInfo = nVozes ? 'Esta capela tem ' + nVozes + (nVozes === 1 ? ' depoimento.' : ' depoimentos.') + ' Eles são editados em Guardiões.' : 'Os depoimentos são editados em Guardiões.';
      vals.eGoVozes = () => this.setState({ aView: 'guardioes' });
      vals.eTexts = [['História', 'historia', 9]].map(([label, k, rows]) => ({ label, value: ec[k], onChange: set(k), rows }));
      vals.eStatus = STATUSES.map(l => { const on = ec.status === l; return { label: l, onClick: () => this.updAndPersist(ec.id, c => ({ ...c, status: l }), 'mudou ' + ec.name + ' para ' + l), bg: on ? ST[l].bg : '#FFF', color: on ? ST[l].color : '#6E655A', border: on ? ST[l].color : '#E3E6E2' }; });
      vals.eChecks = [['Capa definida', this.photos(ec).length > 0], ['Alt-text em todas as imagens', ma === 0], ['Coordenadas preenchidas', !!ec.lat], ['História escrita', ec.historia.trim().length > 40]].map(([label, ok]) => ({ label, mark: ok ? '✓' : '!', color: ok ? '#5E8466' : '#B4633E' }));
      const hist = s.log.filter(l => l.cid === ec.id).map(l => ({ who: l.who, what: l.what, when: ago(l.t) }));
      vals.eHistory = hist.length || DB.configured ? hist : [{ who: 'Sistema', what: 'versão inicial importada do catálogo', when: 'há 5 d' }];
    }
    const all = []; s.chapels.forEach(c => c.media.forEach(m => all.push({ ...m, chapel: c.name, cid: c.id })));
    const lt = s.libType;
    vals.libChips = [['todos', 'Todos'], ['foto', 'Fotos'], ['video', 'Vídeos'], ['audio', 'Áudios']].map(([k, l]) => { const on = lt === k; return { label: l + ' · ' + (k === 'todos' ? all.length : all.filter(m => m.type === k).length), onClick: () => this.setState({ libType: k }), bg: on ? '#141614' : '#FFF', color: on ? '#FFF' : '#141614', border: on ? '#141614' : '#E3E6E2' }; });
    vals.libList = all.filter(m => lt === 'todos' || m.type === lt).map(m => ({ ...m, isFoto: m.type === 'foto', notFoto: m.type !== 'foto', typeLabel: m.type === 'video' ? 'VÍDEO' : 'ÁUDIO', noAlt: !m.alt.trim(), caption: m.caption || 'Sem legenda', open: () => this.setState({ editId: m.cid, aView: 'editor', aTab: 'midia' }) }));
    vals.guardList = s.guardians.filter(g => this.matchesFilter(g, s.guardFilter)).map(g => { const c = chapelById(g.capela_id), st = ST[g.status]; return {
      ...g, chapel: c ? c.name + (c.removed_at ? ' (na lixeira)' : '') : 'Sem capela', initial: initialOf(g.nome), hasFoto: !!g.foto_url, noFoto: !g.foto_url, stBg: st.bg, stColor: st.color, isLive: !g.removed_at, isTrash: !!g.removed_at,
      info: (g.transcricao.trim() ? 'Transcrito' : 'Sem transcrição') + ' · ' + (g.audio_url ? 'com áudio' : 'sem áudio'),
      authLabel: g.autorizacao ? 'Autorização assinada' : 'Sem autorização', authColor: g.autorizacao ? '#3F6148' : '#A33B20',
      onStatus: e => this.updGuardianAndPersist(g.id, x => ({ ...x, status: e.target.value }), x => 'mudou ' + x.nome + ' para ' + x.status),
      edit: () => this.setState({ gEditId: g.id, aView: 'guardiao', saved: false }), del: () => this.deleteGuardian(g),
      restore: () => this.updGuardianAndPersist(g.id, x => ({ ...x, removed_at: null }), x => 'restaurou ' + x.nome)
    }; });
    if (ge) {
      const set = k => e => this.updGuardian(ge.id, g => ({ ...g, [k]: e.target.value })), flag = k => e => this.updGuardian(ge.id, g => ({ ...g, [k]: e.target.checked })), file = kind => e => { const f = e.target.files[0]; e.target.value = ''; this.uploadGuardianFile(ge, kind, f); };
      const clear = (kind, label) => () => this.updGuardianAndPersist(ge.id, g => ({ ...g, [kind + '_url']: null, [kind + '_path']: null }), g => 'removeu ' + label + ' de ' + g.nome);
      vals.ge = {
        ...ge, stBg: ST[ge.status].bg, stColor: ST[ge.status].color, hasFoto: !!ge.foto_url, hasAudio: !!ge.audio_url, audioLabel: ge.audio_url ? 'Trocar áudio' : 'Enviar áudio',
        capelaValue: ge.capela_id == null ? '' : String(ge.capela_id), capelaOptions: [{ v: '', l: 'Sem capela' }, ...live.map(c => ({ v: String(c.id), l: c.name }))],
        onNome: set('nome'), onPapel: set('papel'), onStatus: set('status'), onCitacao: set('citacao'), onTranscricao: set('transcricao'), onAuth: flag('autorizacao'), onDestaque: flag('destaque'),
        onCapela: e => this.updGuardian(ge.id, g => ({ ...g, capela_id: e.target.value ? +e.target.value : null })),
        onFoto: file('foto'), onAudio: file('audio'), clearFoto: clear('foto', 'a foto'), clearAudio: clear('audio', 'o áudio'),
        del: () => this.deleteGuardian(ge), save: async () => { if (await this.persistGuardian(ge.id)) this.addLog('salvou ' + this.state.guardians.find(g => g.id === ge.id).nome, ge.capela_id); }
      };
    }
    return vals;
  }
}
